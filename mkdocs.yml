site_name: SrotaX Docs
site_url: https://docs.srotax.com/
site_description: Build, test, and release business decisions with SrotaX.
theme:
  name: material
  custom_dir: overrides
  logo: images/brand/srotax-white.png
  palette:
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
nav:
  - Get started:
    - Overview: index.md
    - Shipping quickstart: quickstart.md
  - Studio guides:
    - Catalog and folders: studio/catalog.md
    - Data Contracts: studio/contracts.md
    - Models: studio/models.md
    - Decision Tables: studio/tables.md
    - Decision Trees: studio/trees.md
    - Flows:
      - First Flow: studio/flows.md
      - Order fulfillment & subflows: studio/order-fulfillment.md
    - Testing: studio/testing.md
    - Change sets: studio/change-sets.md
    - Releases: studio/releases.md
  - Integration:
    - Java HTTP client: integration/java.md
    - Runtime API: integration/runtime.md
  - Reference:
    - Schema format: reference/schemas.md
    - Flow steps: reference/steps.md
    - Expressions: reference/expressions.md
    - Statistics and bitwise: reference/array-statistics.md
    - MongoDB compatibility: reference/mongo-compatibility.md
    - Conditions: reference/conditions.md
